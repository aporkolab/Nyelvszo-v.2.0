# Nginx configuration for the compiled Angular application.
#
# The container runs as the unprivileged `nginx` user, so there is no `user`
# directive (it is only meaningful for a root master process), the listen port
# is above 1024, the pid file lives in /tmp and the logs go to the container's
# stdout/stderr instead of /var/log.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # This server only hands out a static bundle; nothing is ever uploaded to
    # it, so a request body larger than a few kilobytes is a mistake or an
    # attack.
    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # -----------------------------------------------------------------------
    # Header values are derived from the request/response instead of being set
    # in nested locations.
    #
    # `add_header` does not merge across levels: as soon as one level declares
    # an `add_header`, every inherited one is dropped. The previous config set
    # the security headers on the `http` level and then added Cache-Control in
    # a nested location for static assets — so every .js, .css, font and image
    # was served with no security headers at all. Computing the values with
    # `map` keeps all `add_header` directives on a single level, where nothing
    # can shadow them. An empty value means the header is not sent.
    # -----------------------------------------------------------------------

    map $uri $app_cache_control {
        # index.html and anything else without a content hash must be
        # revalidated, otherwise a browser keeps asking for bundles that the
        # last deploy deleted.
        default                                                                 "no-cache";
        "~*\.(?:css|js|mjs|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|webp|avif)$" "public, max-age=31536000, immutable";
    }

    # The application's Content-Security-Policy. Only HTML responses carry it;
    # on a bundle or an image it would be dead weight.
    #
    #   script-src 'self'          — AOT-compiled Angular needs no 'unsafe-eval';
    #                                the JIT compiler (which does) is not shipped.
    #   style-src  'unsafe-inline' — Angular injects component styles as <style>
    #                                elements at runtime, and ngx-toastr sets
    #                                inline styles. Removing this requires
    #                                bootstrapping with ngCspNonce.
    #   connect-src                — the API is a different origin in production
    #                                (environment.prod.ts -> https://api.nyelvszo.eu).
    #                                'self' covers the reverse-proxied /api/ path.
    #                                Change both together.
    map $sent_http_content_type $app_content_security_policy {
        default       "";
        "~*text/html" "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.nyelvszo.eu; manifest-src 'self'";
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Every response header lives on this one level — see the note above
        # the maps before adding an `add_header` to any location below.
        #
        # X-XSS-Protection is intentionally absent: the legacy auditor it
        # enabled is gone from every current browser and was itself exploitable.
        # The CSP replaces it.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy $app_content_security_policy always;
        add_header Cache-Control $app_cache_control always;

        # Angular routes are client side: unknown paths must return the shell.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Liveness probe for the container healthcheck and the reverse proxy.
        # `default_type` rather than `add_header Content-Type`, which would
        # drop the security headers for this response.
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Editor backups and VCS leftovers must never be served if one ever
        # ends up in the build output.
        location ~ /\. {
            deny all;
        }

        # No /api/ or /ws/ proxy here.
        #
        # The application calls the API cross-origin, and a `proxy_pass
        # http://backend:3000` would make this container refuse to start
        # whenever that name does not resolve — nginx resolves upstream names
        # at configuration load. Routing to the API is the reverse proxy's job
        # (nginx/conf.d/production.conf). WebSockets no longer exist at all.

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            root /usr/share/nginx/html;
        }
    }
}
