<section class="login">
  <div class="container container--narrow">
    <div class="card">
      <div class="card__body stack stack--loose">
        <div class="stack stack--tight login__intro">
          <img class="login__logo" src="assets/img/minlogo.png" alt="" width="250" height="250" />
          <h1 class="login__title">{{ 'login.title' | translate }}</h1>
          <p class="measure center login__lead">{{ 'login.lead' | translate }}</p>
        </div>

        @if (sessionExpired()) {
          <div class="alert alert--warning" role="status">
            <i-feather name="alert-triangle" aria-hidden="true" />
            <span>{{ 'login.sessionExpired' | translate }}</span>
          </div>
        }

        @if (auth.error(); as message) {
          <div #errorAlert class="alert alert--danger" role="alert" tabindex="-1">
            <i-feather name="alert-circle" aria-hidden="true" />
            <span>{{ message }}</span>
          </div>
        }

        <form class="stack" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
          <div class="field">
            <label class="field__label" for="login-email" data-required>
              {{ 'login.email' | translate }}
            </label>
            <input
              id="login-email"
              class="input"
              type="email"
              formControlName="email"
              autocomplete="email"
              autocapitalize="none"
              spellcheck="false"
              required
              [attr.aria-invalid]="emailError() ? 'true' : null"
              [attr.aria-describedby]="emailError() ? 'login-email-error' : null"
            />
            @if (emailError(); as key) {
              <p class="field__error" id="login-email-error">
                <i-feather name="alert-circle" aria-hidden="true" />
                <span>{{ key | translate }}</span>
              </p>
            }
          </div>

          <div class="field">
            <label class="field__label" for="login-password" data-required>
              {{ 'login.password' | translate }}
            </label>
            <input
              id="login-password"
              class="input"
              type="password"
              formControlName="password"
              autocomplete="current-password"
              required
              [attr.aria-invalid]="passwordError() ? 'true' : null"
              [attr.aria-describedby]="passwordError() ? 'login-password-error' : null"
            />
            @if (passwordError(); as key) {
              <p class="field__error" id="login-password-error">
                <i-feather name="alert-circle" aria-hidden="true" />
                <span>{{ key | translate }}</span>
              </p>
            }
          </div>

          <button
            class="btn btn--primary btn--block login__submit"
            type="submit"
            [disabled]="auth.isLoading()"
          >
            @if (auth.isLoading()) {
              <span class="spinner" aria-hidden="true"></span>
            }
            {{ 'login.submit' | translate }}
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
