<div class="container container--medium">
  <div class="state">
    <span class="state__icon">
      <i-feather name="alert-triangle" aria-hidden="true" />
    </span>
    <h1 class="state__title">{{ 'notFound.title' | translate }}</h1>
    <p class="state__body">{{ 'notFound.body' | translate }}</p>
    <a class="btn btn--primary" routerLink="/entries">
      <i-feather name="arrow-left" aria-hidden="true" />
      {{ 'actions.backToDictionary' | translate }}
    </a>
  </div>
</div>
