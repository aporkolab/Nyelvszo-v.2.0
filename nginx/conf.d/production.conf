# NyelvSzó production reverse proxy.
#
# Terminates TLS, rate limits, and routes: the Angular bundle comes from the
# `frontend` container, everything the API owns goes to `backend`.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

upstream backend_api {
    server backend:3000;
    keepalive 32;
}

upstream frontend_app {
    # The frontend container runs nginx as a non-root user, which cannot bind
    # port 80.
    server frontend:8080;
    keepalive 16;
}

# The application's Content-Security-Policy, applied to HTML only.
#
# `add_header` is replaced, never merged, by the next level that declares one,
# so this value is computed here and emitted exactly once, at server level.
# Keep it in sync with frontend/nginx.conf, which serves the same bundle when
# the frontend container is reached directly.
map $sent_http_content_type $app_content_security_policy {
    default       "";
    "~*text/html" "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.nyelvszo.eu; manifest-src 'self'";
}

# ---------------------------------------------------------------------------
# HTTP: ACME challenge and the redirect to HTTPS.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name nyelvszo.eu www.nyelvszo.eu;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Load balancer probe. `default_type` instead of `add_header Content-Type`
    # so this location does not shadow inherited headers.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # `listen ... http2` is deprecated since nginx 1.25 and logs a warning.
    http2 on;

    server_name nyelvszo.eu www.nyelvszo.eu;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/nyelvszo.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nyelvszo.eu/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # -----------------------------------------------------------------------
    # Security headers.
    #
    # Both upstreams set their own copies (helmet in the API, frontend/
    # nginx.conf in the bundle container). Two X-Frame-Options headers are
    # treated as a conflict and ignored by some browsers, and two CSP headers
    # are enforced as an intersection that is hard to reason about — so the
    # upstream copies are stripped and this edge is the single authority.
    #
    # Because no location below declares an `add_header`, every response
    # inherits the whole set. Adding one anywhere means repeating all of them
    # there.
    # -----------------------------------------------------------------------
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header X-Powered-By;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy $app_content_security_policy always;

    limit_conn conn_limit 20;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Matches the 100 kB body limit the API enforces itself, with room for the
    # multipart overhead of a bulk import.
    client_max_body_size 1M;

    # Common proxy headers. TRUST_PROXY_HOPS=1 in the API makes it trust
    # exactly this hop for the client address, so X-Forwarded-For must be set
    # on every proxied location.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Keepalive to the upstreams requires an empty Connection header.
    proxy_set_header Connection "";

    # Legacy /api/ prefix: the API itself serves the routes at the root, so the
    # trailing slash on proxy_pass strips the prefix.
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_api/;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Credential endpoint, much tighter budget than the rest of the API.
    location /login {
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://backend_api/login;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # The routes the API actually mounts. There is no /ws: the WebSocket server
    # was removed.
    location ~ ^/(entries|users|health|api-docs) {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_api;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # The Angular bundle.
    #
    # No nested location for static assets: the frontend container already
    # sends `Cache-Control: public, max-age=31536000, immutable` for hashed
    # files and `no-cache` for the shell, and the nested `add_header
    # Cache-Control` that used to live here silently discarded every security
    # header above for exactly those files.
    location / {
        proxy_pass http://frontend_app;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        root /usr/share/nginx/html;
    }
}
