# NyelvSzó — development stack.
#
# Every published port is bound to the loopback interface. `27017:27017` binds
# 0.0.0.0, which put the development database on every network the laptop is
# attached to; on a café or conference network that is a public database.
#
# Values come from a .env file next to this one; see backend/.env.example.
# The `:?` variables have no default on purpose — starting without them used to
# mean MongoDB ran with authentication disabled.
#
# The `version:` key is gone: Compose v2 ignores it and warns about it.

services:
  mongodb:
    image: mongo:7.0
    container_name: nyelvszo_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:?set DB_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
      MONGO_INITDB_DATABASE: ${DB_NAME:-nyelvszo}
      # Optional least-privilege account for the API; when unset, init-mongo.js
      # only creates the collections and indexes.
      MONGO_APP_USER: ${DB_APP_USER:-}
      MONGO_APP_PASSWORD: ${DB_APP_PASS:-}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./backend/scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - nyelvszo-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: nyelvszo_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3000
      # URL-encode DB_USER/DB_PASS if they contain :/?#[]@ — the URI parser
      # splits on those before any decoding happens.
      - MONGODB_URI=mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/${DB_NAME:-nyelvszo}?authSource=admin
      # Two different secrets, 32+ characters each; src/index.js refuses to
      # start otherwise. Generate with:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:4200}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      - ./backend/logs:/app/logs
      # Keep the image's node_modules; the host tree is built for a different
      # platform and would shadow it.
      - /app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - nyelvszo-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      # Liveness, not readiness: a database blip must not restart a healthy
      # process.
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: nyelvszo_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/angular.json:/app/angular.json
      - ./frontend/package.json:/app/package.json
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - /app/node_modules
    ports:
      - "127.0.0.1:4200:4200"
    networks:
      - nyelvszo-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4200/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

# No nginx service here. The only configuration in nginx/conf.d is the
# production one, which needs Let's Encrypt certificates for nyelvszo.eu and
# fails to start without them; in development the browser talks to the dev
# server on 4200 and the API on 3000 directly. The reverse proxy lives in
# docker-compose.prod.yml.
#
# No redis service either — nothing in the backend uses Redis any more; the
# cache is in-process (src/middleware/cache.js).

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  nyelvszo-network:
    driver: bridge
